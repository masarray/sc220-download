name: Sync release metadata to landing pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sc220-release-landing-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public distribution repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Synchronize latest release into landing-page source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from datetime import date
          from pathlib import Path

          root = Path('.')
          release = json.loads((root / 'latest.json').read_text(encoding='utf-8'))
          version = str(release['version']).removeprefix('v')
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit(f'Invalid latest.json version: {version!r}')

          tag = f'v{version}'
          published_iso = str(release['published'])
          published_date = date.fromisoformat(published_iso)
          download = str(release['download'])
          sha256 = str(release['sha256']).lower()
          installer = download.rsplit('/', 1)[-1]
          release_url = f'https://github.com/masarray/sc220-download/releases/tag/{tag}'
          notes_name = f'RELEASE_NOTES_{tag}.md'

          if installer != f'SC220-Live-{tag}-Setup-win-x64.exe':
              raise SystemExit(f'Unexpected installer name: {installer}')
          if not re.fullmatch(r'[0-9a-f]{64}', sha256):
              raise SystemExit('latest.json sha256 is invalid')
          if not (root / notes_name).is_file():
              raise SystemExit(f'Missing {notes_name}')

          months_id = (
              'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
              'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
          )
          published_id = f'{published_date.day} {months_id[published_date.month - 1]} {published_date.year}'
          published_en = f'{published_date.strftime("%B")} {published_date.day}, {published_date.year}'

          def replace_required(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, flags=flags)
              if count == 0:
                  raise SystemExit(f'Missing expected field: {label}')
              return updated

          app_path = root / 'app.js'
          app = app_path.read_text(encoding='utf-8')
          fallback = (
              'const fallback = {\n'
              f'    version: "{version}",\n'
              f'    published: "{published_iso}",\n'
              f'    download: "{download}",\n'
              f'    sha256: "{sha256}"\n'
              '  };'
          )
          app = replace_required(
              app,
              r'const fallback = \{\n\s*version: "[^"]+",\n\s*published: "[^"]+",\n\s*download: "[^"]+",\n\s*sha256: "[^"]+"\n\s*\};',
              fallback,
              'app.js fallback',
          )
          app_path.write_text(app, encoding='utf-8', newline='\n')

          def sync_page(path_str, language):
              path = root / path_str
              text = path.read_text(encoding='utf-8')
              match = re.search(r'SC220 Live (v\d+\.\d+\.\d+)', text)
              if not match:
                  raise SystemExit(f'Cannot identify SC220 release in {path_str}')
              old_tag = match.group(1)
              text = text.replace(old_tag, tag)
              text = replace_required(text, r'"softwareVersion":"\d+\.\d+\.\d+"', f'"softwareVersion":"{version}"', f'{path_str} softwareVersion')
              text = replace_required(text, r'"datePublished":"\d{4}-\d{2}-\d{2}"', f'"datePublished":"{published_iso}"', f'{path_str} datePublished')
              text = replace_required(text, r'"downloadUrl":"[^"]+"', f'"downloadUrl":"{download}"', f'{path_str} schema downloadUrl')
              text = replace_required(text, r'<code data-sha>[0-9a-fA-F]{64}</code>', f'<code data-sha>{sha256}</code>', f'{path_str} checksum')
              published_text = published_id if language == 'id' else published_en
              text = replace_required(text, r'<span data-published>[^<]+</span>', f'<span data-published>{published_text}</span>', f'{path_str} published label')
              text = replace_required(text, r'https://github\.com/masarray/sc220-download/releases/download/v\d+\.\d+\.\d+/SC220-Live-v\d+\.\d+\.\d+-Setup-win-x64\.exe', download, f'{path_str} direct download')
              text = replace_required(text, r'https://github\.com/masarray/sc220-download/releases/tag/v\d+\.\d+\.\d+', release_url, f'{path_str} release link')
              text = re.sub(r'SC220-Live-v\d+\.\d+\.\d+-Setup-win-x64\.exe', installer, text)

              if language == 'id':
                  text = re.sub(r'<li><div><b>Installer sekitar [^<]+</b><span>Unduh langsung dari GitHub Releases\.</span></div></li>', '<li><div><b>Installer Windows x64</b><span>Unduh langsung dari GitHub Releases.</span></div></li>', text)
                  text = re.sub(r'<tr><td>Ukuran installer</td><td>[^<]+</td></tr>', '<tr><td>Ukuran installer</td><td>Lihat metadata asset di GitHub Release</td></tr>', text)
                  section = (
                      '<section class="article-section alt" id="baru">\n'
                      '  <div class="article-shell">\n'
                      f'    <span class="guide-eyebrow">RILIS TERBARU {tag}</span>\n'
                      '    <h2>Versi terbaru, installer terverifikasi, dan catatan perubahan resmi.</h2>\n'
                      f'    <p>Halaman download ini selalu mengikuti metadata release stabil terbaru. Detail perubahan {tag}, instalasi, integritas file, dan catatan teknis tersedia pada catatan rilis resmi.</p>\n'
                      f'    <p><a href="../{notes_name}">Baca catatan rilis {tag} lengkap →</a></p>\n'
                      '  </div>\n'
                      '</section>'
                  )
                  pattern = r'<section class="article-section alt" id="baru">.*?</section>'
              else:
                  text = re.sub(r'<li><div><b>About [^<]+</b><span>Downloaded directly from GitHub Releases\.</span></div></li>', '<li><div><b>Windows x64 installer</b><span>Downloaded directly from GitHub Releases.</span></div></li>', text)
                  text = re.sub(r'<tr><td>Installer size</td><td>[^<]+</td></tr>', '<tr><td>Installer size</td><td>See asset metadata on the GitHub Release</td></tr>', text)
                  section = (
                      '<section class="article-section alt" id="new">\n'
                      '  <div class="article-shell">\n'
                      f'    <span class="guide-eyebrow">LATEST RELEASE {tag}</span>\n'
                      '    <h2>The current verified build and its official change notes.</h2>\n'
                      f'    <p>This download page follows the latest stable release metadata automatically. Full {tag} changes, installation notes, file integrity details, and technical notes are available in the official release notes.</p>\n'
                      f'    <p><a href="../../{notes_name}">Read the complete {tag} release notes →</a></p>\n'
                      '  </div>\n'
                      '</section>'
                  )
                  pattern = r'<section class="article-section alt" id="new">.*?</section>'

              text = replace_required(text, pattern, section, f'{path_str} latest release section', flags=re.DOTALL)
              if download not in text or sha256 not in text or notes_name not in text:
                  raise SystemExit(f'{path_str} failed post-sync validation')
              path.write_text(text, encoding='utf-8', newline='\n')

          sync_page('download/index.html', 'id')
          sync_page('en/download/index.html', 'en')
          PY

      - name: Validate synchronized release metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' latest.json)"
          tag="v$version"
          download="$(jq -r '.download' latest.json)"
          sha256="$(jq -r '.sha256' latest.json)"
          grep -Fq "version: \"$version\"" app.js
          grep -Fq "$download" app.js
          grep -Fq "$download" download/index.html
          grep -Fq "$download" en/download/index.html
          grep -Fq "$sha256" download/index.html
          grep -Fq "$sha256" en/download/index.html
          grep -Fq "RELEASE_NOTES_${tag}.md" download/index.html
          grep -Fq "RELEASE_NOTES_${tag}.md" en/download/index.html
          git diff --check

      - name: Commit synchronized landing pages
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app.js download/index.html en/download/index.html; then
            echo "Landing pages already match latest.json."
            exit 0
          fi
          version="$(jq -r '.version' latest.json)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js download/index.html en/download/index.html
          git commit -m "site: sync download landing to v$version"
          git push origin HEAD:main
