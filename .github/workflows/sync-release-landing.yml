name: Sync release metadata to landing pages

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Publish verified SC220 draft release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sc220-release-metadata-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public distribution repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Stage verified release behind production gate
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/manage-production-release.sh stage

      - name: Synchronize latest.json to every public release surface
        run: python3 scripts/sync-release-metadata.py

      - name: Validate synchronized release contract
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' latest.json)"
          tag="v$version"
          published="$(jq -r '.published' latest.json)"
          download="$(jq -r '.download' latest.json)"
          sha256="$(jq -r '.sha256' latest.json)"
          screenshot='assets/screenshot/Screenshot.webp'

          for file in app.js index.html en/index.html download/index.html en/download/index.html README.md README.id.md; do
            grep -Fq "$version" "$file"
          done

          grep -Fq "$download" app.js
          grep -Fq "$download" index.html
          grep -Fq "$download" en/index.html
          grep -Fq "$download" download/index.html
          grep -Fq "$download" en/download/index.html
          grep -Fq "$download" README.md
          grep -Fq "$download" README.id.md

          grep -Fq "$sha256" index.html
          grep -Fq "$sha256" en/index.html
          grep -Fq "$sha256" download/index.html
          grep -Fq "$sha256" en/download/index.html
          grep -Fq "$sha256" README.md
          grep -Fq "$sha256" README.id.md

          grep -Fq "\"softwareVersion\":\"$version\"" index.html
          grep -Fq "\"softwareVersion\":\"$version\"" en/index.html
          grep -Fq "\"datePublished\":\"$published\"" index.html
          grep -Fq "\"datePublished\":\"$published\"" en/index.html

          grep -Fq "$screenshot" index.html
          grep -Fq "../$screenshot" en/index.html
          grep -Fq "$screenshot" README.md
          grep -Fq "$screenshot" README.id.md

          grep -Fq "RELEASE_NOTES_${tag}.md" download/index.html
          grep -Fq "RELEASE_NOTES_${tag}.md" en/download/index.html
          grep -Fq "RELEASE_NOTES_${tag}.md" README.md
          grep -Fq "RELEASE_NOTES_${tag}.md" README.id.md

          if grep -Eq 'SC220 Live v0\.1\.[01]|SC220-Live-v0\.1\.[01]-Setup-win-x64\.exe|softwareVersion":"0\.1\.0"|datePublished":"2026-08-06"' \
            index.html en/index.html README.md README.id.md scripts/build-static-site.sh; then
            echo "Stale release metadata remains in a current public surface." >&2
            exit 1
          fi

          bash -n scripts/verify-production-release.sh
          bash -n scripts/manage-production-release.sh
          git diff --check
          bash scripts/build-static-site.sh cloudflare

      - name: Commit synchronized public release surfaces
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            app.js
            index.html
            en/index.html
            download/index.html
            en/download/index.html
            README.md
            README.id.md
            scripts/build-static-site.sh
          )

          if git diff --quiet -- "${targets[@]}"; then
            echo "All public surfaces already match latest.json."
            exit 0
          fi

          version="$(jq -r '.version' latest.json)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${targets[@]}"
          git commit -m "site: sync all release surfaces to v$version"
          git push origin HEAD:main
