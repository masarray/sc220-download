name: Publish SC220 Live v0.1.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.1.0.yml

permissions:
  contents: write

concurrency:
  group: publish-sc220-live-v0.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: "https://sdmntprwestus2.oaiusercontent.com/files/00000000-52f8-81f8-82d0-8e38b6aceacb/raw?se=2026-08-06T02:36:46Z&sp=r&sv=2026-02-06&sr=b&scid=efbab71c-4a7e-53f7-8abd-048c96dfc690&skoid=27fbae2c-124f-4566-a0d8-1b07a5a41c53&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T21:00:43Z&ske=2026-08-06T21:00:43Z&sks=b&skv=2026-02-06&sig=TH3aOvCFG5e7qBG6jQBWWBmB3X8x%2BVob7pjT463zNh4%3D"
      RELEASE_TAG: v0.1.0
      INSTALLER: SC220-Live-v0.1.0-Setup-win-x64.exe
      INSTALLER_SHA256: c8a441f07605f48805233fbddf466312c1de733c647c95705317ad13ee2b7b04
      ARCHIVE_SHA256: 480907860bdc00ca536371dc2cdb6247b3c1130ecd6c3af9fa831994d0bb26a7
      SOURCE_COMMIT: 3629c5f816159e4a1455220ad51c58362568a29a
    steps:
      - uses: actions/checkout@v4

      - name: Download immutable release candidate
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            "$ARTIFACT_URL" --output release.zip
          echo "$ARCHIVE_SHA256  release.zip" | sha256sum --check --strict

      - name: Validate public payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir payload
          unzip -q release.zip -d payload

          expected=(
            "$INSTALLER"
            "$INSTALLER.sha256"
            "SC220-Live-v0.1.0-Setup-win-x64.manifest.json"
            "BUILD_COMMIT.txt"
            "VB_CABLE_PACK45_SHA256.txt"
          )
          for file in "${expected[@]}"; do
            test -f "payload/$file"
          done

          actual_count="$(find payload -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$actual_count" = "5"
          echo "$INSTALLER_SHA256  payload/$INSTALLER" | sha256sum --check --strict
          test "$(tr -d '\r\n ' < payload/BUILD_COMMIT.txt)" = "$SOURCE_COMMIT"
          grep -Fq "\"installer_sha256\": \"$INSTALLER_SHA256\"" \
            payload/SC220-Live-v0.1.0-Setup-win-x64.manifest.json

      - name: Create public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "payload/$INSTALLER"
            "payload/$INSTALLER.sha256"
            "payload/SC220-Live-v0.1.0-Setup-win-x64.manifest.json"
            "payload/BUILD_COMMIT.txt"
            "payload/VB_CABLE_PACK45_SHA256.txt"
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "SC220 Live v0.1.0" \
              --notes-file RELEASE_NOTES_v0.1.0.md \
              --latest
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "SC220 Live v0.1.0" \
              --notes-file RELEASE_NOTES_v0.1.0.md \
              --latest
          fi

      - name: Verify public endpoints
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName,url \
            --jq 'select(.isDraft == false and .isPrerelease == false and .tagName == "v0.1.0")'
          curl --fail --location --retry 3 \
            "https://github.com/masarray/sc220-download/releases/download/$RELEASE_TAG/$INSTALLER.sha256" \
            --output published.sha256
          grep -Fq "$INSTALLER_SHA256" published.sha256
