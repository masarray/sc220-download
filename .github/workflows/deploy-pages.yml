name: Deploy SC220 Live to GitHub Pages

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact commit/ref to deploy
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact commit/ref to deploy
        required: false
        default: main
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public distribution repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}

      - name: Build static site mirror
        run: bash scripts/build-static-site.sh github

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
