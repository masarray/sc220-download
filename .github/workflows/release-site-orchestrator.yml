name: Refresh site after verified release

on:
  workflow_run:
    workflows:
      - Publish verified SC220 draft release
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release landing synchronization
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run sync-release-landing.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
