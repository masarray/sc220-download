name: Deploy SC220 Live to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Cloudflare Account ID is an account identifier, not an authentication secret.
      CLOUDFLARE_ACCOUNT_ID: c5f2d99976a89c1825c36dc6ae061ca0
    steps:
      - name: Checkout public distribution repository
        uses: actions/checkout@v6

      - name: Build Cloudflare static site
        run: bash scripts/build-static-site.sh cloudflare

      - name: Check Cloudflare API token
        id: credentials
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment is prepared but skipped until CLOUDFLARE_API_TOKEN is configured as a repository secret."
          fi

      - name: Ensure sc220 Pages project exists
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          projects="$(npx --yes wrangler@latest pages project list --json)"
          if printf '%s' "$projects" | jq -e '.[] | select(.name == "sc220")' >/dev/null; then
            echo "Cloudflare Pages project 'sc220' already exists."
          else
            echo "Creating Cloudflare Pages project 'sc220' with main as production branch."
            npx --yes wrangler@latest pages project create sc220 --production-branch=main
          fi

      - name: Deploy sc220.pages.dev with latest Wrangler
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy dist \
            --project-name=sc220 \
            --branch=main \
            --commit-dirty=true

      - name: Verify production origin and SEO signals
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          origin="https://sc220.pages.dev"
          mkdir -p /tmp/sc220-smoke

          fetch() {
            local path="$1"
            local output="$2"
            echo "Checking ${origin}${path}"
            curl --fail --location --silent --show-error \
              --retry 10 --retry-delay 3 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              "${origin}${path}" -o "$output"
          }

          fetch "/" /tmp/sc220-smoke/index.html
          fetch "/en/" /tmp/sc220-smoke/en.html
          fetch "/sitemap.xml" /tmp/sc220-smoke/sitemap.xml
          fetch "/robots.txt" /tmp/sc220-smoke/robots.txt

          grep -Fq 'rel="canonical" href="https://sc220.pages.dev/"' /tmp/sc220-smoke/index.html
          grep -Fq 'rel="canonical" href="https://sc220.pages.dev/en/"' /tmp/sc220-smoke/en.html
          grep -Fq '<loc>https://sc220.pages.dev/' /tmp/sc220-smoke/sitemap.xml
          grep -Fq 'Sitemap: https://sc220.pages.dev/sitemap.xml' /tmp/sc220-smoke/robots.txt

          echo "Production smoke test passed: sc220.pages.dev is live with canonical SEO signals."
