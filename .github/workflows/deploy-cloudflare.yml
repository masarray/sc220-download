name: Deploy SC220 Live to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Cloudflare Account ID is an account identifier, not an authentication secret.
      CLOUDFLARE_ACCOUNT_ID: c5f2d99976a89c1825c36dc6ae061ca0
    steps:
      - name: Checkout public distribution repository
        uses: actions/checkout@v6

      - name: Build Cloudflare static site
        run: bash scripts/build-static-site.sh cloudflare

      - name: Check Cloudflare API token
        id: credentials
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment is prepared but skipped until CLOUDFLARE_API_TOKEN is configured as a repository secret."
          fi

      - name: Deploy sc220.pages.dev with latest Wrangler
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy dist \
            --project-name=sc220 \
            --branch=main \
            --commit-dirty=true

      - name: Verify production release contract and SEO signals
        if: steps.credentials.outputs.ready == 'true'
        run: bash scripts/verify-production-release.sh https://sc220.pages.dev
