name: Deploy SC220 Live to Cloudflare Pages

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact commit/ref to deploy
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact commit/ref to deploy
        required: false
        default: main
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c5f2d99976a89c1825c36dc6ae061ca0
    steps:
      - name: Checkout public distribution repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}

      - name: Build Cloudflare static site
        run: bash scripts/build-static-site.sh cloudflare

      - name: Check Cloudflare API token
        id: credentials
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment cannot pass the production gate without CLOUDFLARE_API_TOKEN." >&2
            exit 1
          fi

      - name: Deploy sc220.pages.dev
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy dist \
            --project-name=sc220 \
            --branch=main \
            --commit-dirty=true

      - name: Verify production release contract and SEO signals
        run: bash scripts/verify-production-release.sh https://sc220.pages.dev
