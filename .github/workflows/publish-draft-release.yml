name: Publish verified SC220 draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version of the existing draft release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sc220-public-release
  cancel-in-progress: false

jobs:
  inspect_installer:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      INNOUNP_URL: https://www.rathlev-home.de/tools/download/innounp-270.zip
      INNOUNP_SHA256: d5514cac741f12ca94f642eacd30d514d820dce016e4d016325413df472c34ea
    steps:
      - name: Inspect exact installer payload with pinned Inno Setup unpacker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 3.0

          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid semantic version: $env:VERSION"
          }

          $tag = "v$env:VERSION"
          $installerName = "SC220-Live-v$env:VERSION-Setup-win-x64.exe"
          $releases = gh api "repos/$env:REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to enumerate draft releases.' }
          $release = @($releases | Where-Object { $_.tag_name -eq $tag }) | Select-Object -First 1
          if (-not $release) { throw "$tag release does not exist." }
          $asset = @($release.assets | Where-Object { $_.name -eq $installerName }) | Select-Object -First 1
          if (-not $asset -or $asset.digest -notmatch '^sha256:[0-9a-f]{64}$') {
            throw 'Draft installer or its GitHub digest is missing.'
          }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/octet-stream'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $installerPath = Join-Path $env:RUNNER_TEMP $installerName
          Invoke-WebRequest -Uri $asset.url -Headers $headers -OutFile $installerPath
          $installerHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ("sha256:$installerHash" -ne [string]$asset.digest) {
            throw 'Downloaded installer does not match the GitHub asset digest.'
          }

          $toolZip = Join-Path $env:RUNNER_TEMP 'innounp-270.zip'
          $toolDir = Join-Path $env:RUNNER_TEMP 'innounp-270'
          Invoke-WebRequest -Uri $env:INNOUNP_URL -OutFile $toolZip
          $toolHash = (Get-FileHash -LiteralPath $toolZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($toolHash -ne $env:INNOUNP_SHA256) {
            throw "Pinned innounp package hash mismatch: $toolHash"
          }
          Expand-Archive -LiteralPath $toolZip -DestinationPath $toolDir
          $innounp = Join-Path $toolDir 'innounp.exe'

          $listing = @(& $innounp -s -b -o -h $installerPath)
          if ($LASTEXITCODE -ne 0) { throw "innounp listing failed with exit code $LASTEXITCODE" }
          $payload = @(
            $listing |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -match '^(\{tmp\}|\{app\}|install_script\.iss$)' }
          )
          $expected = @(
            '{tmp}\SC220PrerequisiteProbe.ps1',
            '{tmp}\sc220-prerequisites\VC_redist.x64.exe',
            '{tmp}\sc220-vbcable\pin_in.ico',
            '{tmp}\sc220-vbcable\pin_out.ico',
            '{tmp}\sc220-vbcable\readme.txt',
            '{tmp}\sc220-vbcable\vbaudio_cable64arm_win10.sys',
            '{tmp}\sc220-vbcable\vbaudio_cable64_2003.cat',
            '{tmp}\sc220-vbcable\vbaudio_cable64_2003.sys',
            '{tmp}\sc220-vbcable\vbaudio_cable64_vista.cat',
            '{tmp}\sc220-vbcable\vbaudio_cable64_vista.sys',
            '{tmp}\sc220-vbcable\vbaudio_cable64_win10.cat',
            '{tmp}\sc220-vbcable\vbaudio_cable64_win10.sys',
            '{tmp}\sc220-vbcable\vbaudio_cable64_win7.cat',
            '{tmp}\sc220-vbcable\vbaudio_cable64_win7.sys',
            '{tmp}\sc220-vbcable\vbaudio_cable_2003.cat',
            '{tmp}\sc220-vbcable\vbaudio_cable_2003.sys',
            '{tmp}\sc220-vbcable\vbaudio_cable_vista.cat',
            '{tmp}\sc220-vbcable\vbaudio_cable_vista.sys',
            '{tmp}\sc220-vbcable\vbaudio_cable_win7.cat',
            '{tmp}\sc220-vbcable\vbaudio_cable_win7.sys',
            '{tmp}\sc220-vbcable\vbaudio_cable_xp.cat',
            '{tmp}\sc220-vbcable\vbaudio_cable_xp.sys',
            '{tmp}\sc220-vbcable\VBCABLE_ControlPanel.exe',
            '{tmp}\sc220-vbcable\VBCABLE_Setup.exe',
            '{tmp}\sc220-vbcable\VBCABLE_Setup_x64.exe',
            '{tmp}\sc220-vbcable\vbMmeCable64_2003.inf',
            '{tmp}\sc220-vbcable\vbMmeCable64_vista.inf',
            '{tmp}\sc220-vbcable\vbMmeCable64_win10.inf',
            '{tmp}\sc220-vbcable\vbMmeCable64_win7.inf',
            '{tmp}\sc220-vbcable\vbMmeCable_2003.inf',
            '{tmp}\sc220-vbcable\vbMmeCable_vista.inf',
            '{tmp}\sc220-vbcable\vbMmeCable_win7.inf',
            '{tmp}\sc220-vbcable\vbMmeCable_xp.inf',
            '{app}\SC220 Live.exe',
            '{app}\Legal\EULA.txt',
            '{app}\Legal\PURCHASE_TERMS.txt',
            '{app}\Legal\THIRD_PARTY_NOTICES.md',
            '{app}\Legal\VB_AUDIO_NOTICE.txt',
            'install_script.iss'
          )
          $difference = @(Compare-Object -ReferenceObject $expected -DifferenceObject $payload)
          if ($difference.Count -gt 0) {
            $difference | Format-Table -AutoSize | Out-String | Write-Error
            throw 'Installer payload differs from the exact public binary allowlist.'
          }

          $extractDir = Join-Path $env:RUNNER_TEMP 'sc220-installer-payload'
          & $innounp -x -b -q -o -h "-d$extractDir" $installerPath
          if ($LASTEXITCODE -ne 0) { throw "innounp extraction failed with exit code $LASTEXITCODE" }

          $forbiddenFiles = @(
            Get-ChildItem -LiteralPath $extractDir -Recurse -File -Force |
              Where-Object {
                $_.Extension -in @('.c','.cc','.cpp','.cxx','.h','.hh','.hpp','.cmake','.pdb','.obj','.lib','.exp','.pfx','.p12','.pem','.key') -or
                $_.Name -in @('CMakeLists.txt','.gitmodules')
              }
          )
          if ($forbiddenFiles.Count -gt 0) {
            throw "Source, debug, or key files are embedded: $($forbiddenFiles.FullName -join ', ')"
          }

          $markers = @(
            'third_party/askp-vst',
            'third_party\askp-vst',
            'PluginProcessor.cpp',
            'PluginProcessor.h',
            'PluginEditor.cpp',
            'PluginEditor.h',
            'BEGIN PRIVATE KEY',
            'ArSonKuPik-license-private-key'
          )
          foreach ($file in Get-ChildItem -LiteralPath $extractDir -Recurse -File -Force) {
            $bytes = [IO.File]::ReadAllBytes($file.FullName)
            $text = [Text.Encoding]::GetEncoding(28591).GetString($bytes)
            foreach ($marker in $markers) {
              if ($text.IndexOf($marker, [StringComparison]::OrdinalIgnoreCase) -ge 0) {
                throw "Private ASK-P source marker found in embedded file $($file.FullName): $marker"
              }
            }
          }

          Write-Host 'Exact installer payload and embedded binary scan passed.'

  publish:
    needs: inspect_installer
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout public distribution repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version and public repository boundary
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi

          forbidden_repo_files="$(
            find . -path './.git' -prune -o -type f \
              \( -iname '*.c' -o -iname '*.cc' -o -iname '*.cpp' -o -iname '*.cxx' \
                 -o -iname '*.h' -o -iname '*.hh' -o -iname '*.hpp' -o -iname '*.cmake' \
                 -o -iname '*.dll' -o -iname '*.pdb' -o -iname '*.obj' -o -iname '*.lib' \
                 -o -iname '*.exp' -o -iname '*.pfx' -o -iname '*.p12' -o -iname '*.pem' \
                 -o -iname '*.key' -o -name 'CMakeLists.txt' -o -name '.gitmodules' \) \
              -print
          )"
          if [[ -n "$forbidden_repo_files" ]]; then
            echo "Public repository boundary violation:" >&2
            echo "$forbidden_repo_files" >&2
            exit 1
          fi

          if grep -RIlE --exclude-dir=.git --exclude=publish-draft-release.yml \
            'third_party[/\\]askp-vst|PluginProcessor\.(cpp|h)|PluginEditor\.(cpp|h)|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' \
            .; then
            echo "Private ASK-P source or key material was found in the public repository." >&2
            exit 1
          fi

      - name: Download and validate draft assets
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          installer="SC220-Live-v$VERSION-Setup-win-x64.exe"
          checksum="$installer.sha256"
          manifest="SC220-Live-v$VERSION-Setup-win-x64.manifest.json"
          expected=(
            "$installer"
            "$checksum"
            "$manifest"
            "BUILD_COMMIT.txt"
            "VC_REDIST_X64_SHA256.txt"
            "VB_CABLE_PACK45_SHA256.txt"
          )

          releases_json="$(gh api "repos/$REPOSITORY/releases?per_page=100")"
          release_json="$(
            jq -c --arg tag "$tag" \
              '.[] | select(.tag_name == $tag)' \
              <<<"$releases_json"
          )"
          if [[ -z "$release_json" ]]; then
            echo "$tag release does not exist." >&2
            exit 1
          fi

          mapfile -t actual < <(jq -r '.assets[].name' <<<"$release_json" | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${actual[*]}" != "${wanted[*]}" ]]; then
            echo "Draft assets do not match the binary-only allowlist." >&2
            printf 'Expected: %s\n' "${wanted[*]}" >&2
            printf 'Actual:   %s\n' "${actual[*]}" >&2
            exit 1
          fi

          mkdir release-assets
          while IFS=$'\t' read -r asset_id asset_name; do
            gh api \
              -H 'Accept: application/octet-stream' \
              "repos/$REPOSITORY/releases/assets/$asset_id" \
              > "release-assets/$asset_name"
          done < <(jq -r '.assets[] | [.id, .name] | @tsv' <<<"$release_json")
          cd release-assets

          expected_hash="$(awk '{print tolower($1)}' "$checksum")"
          actual_hash="$(sha256sum "$installer" | awk '{print $1}')"
          [[ "$expected_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$actual_hash" == "$expected_hash" ]]
          grep -Fq "$installer" "$checksum"

          jq -e --arg version "$VERSION" --arg file "$installer" --arg hash "$actual_hash" '
            .product == "SC220 Live" and
            .version == $version and
            .installer_file == $file and
            (.source_commit | test("^[0-9a-fA-F]{40}$")) and
            (.installer_sha256 | ascii_downcase) == $hash and
            (.vc_runtime.sha256 | test("^[0-9a-fA-F]{64}$")) and
            (.vb_cable.sha256 | test("^[0-9a-fA-F]{64}$"))
          ' "$manifest" >/dev/null

          build_commit="$(tr -d '\r\n ' < BUILD_COMMIT.txt | tr '[:upper:]' '[:lower:]')"
          vc_hash="$(tr -d '\r\n ' < VC_REDIST_X64_SHA256.txt | tr '[:upper:]' '[:lower:]')"
          vb_hash="$(tr -d '\r\n ' < VB_CABLE_PACK45_SHA256.txt | tr '[:upper:]' '[:lower:]')"
          [[ "$build_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$vc_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$vb_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$build_commit" == "$(jq -r '.source_commit | ascii_downcase' "$manifest")" ]]
          [[ "$vc_hash" == "$(jq -r '.vc_runtime.sha256 | ascii_downcase' "$manifest")" ]]
          [[ "$vb_hash" == "$(jq -r '.vb_cable.sha256 | ascii_downcase' "$manifest")" ]]

          if strings -a "$installer" | grep -Ei \
            'third_party[/\\]askp-vst|PluginProcessor\.(cpp|h)|PluginEditor\.(cpp|h)|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY'; then
            echo "Private ASK-P source path or key material was found in the installer." >&2
            exit 1
          fi

          echo "INSTALLER=$installer" >> "$GITHUB_ENV"
          echo "INSTALLER_SHA256=$actual_hash" >> "$GITHUB_ENV"
          echo "MANIFEST=$manifest" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$build_commit" >> "$GITHUB_ENV"
          echo "RELEASE_IS_DRAFT=$(jq -r '.draft' <<<"$release_json")" >> "$GITHUB_ENV"

      - name: Prepare public release metadata
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          release_base="https://github.com/$REPOSITORY/releases/download/$tag"
          published="$(date -u +%F)"

          jq -n \
            --arg version "$VERSION" \
            --arg published "$published" \
            --arg download "$release_base/$INSTALLER" \
            --arg sha256 "$INSTALLER_SHA256" \
            --arg checksum "$release_base/$INSTALLER.sha256" \
            --arg manifest "$release_base/$MANIFEST" \
            --arg source_commit "$SOURCE_COMMIT" \
            '{
              product: "SC220 Live",
              version: $version,
              published: $published,
              platform: "windows-x64",
              status: "stable",
              download: $download,
              sha256: $sha256,
              checksum: $checksum,
              manifest: $manifest,
              source_commit: $source_commit,
              smart_installer: true,
              vc_runtime_bundled: true,
              vb_cable_optional: true
            }' > latest.json

          gh release view "$tag" --repo "$REPOSITORY" --json body --jq '.body' \
            > "RELEASE_NOTES_v$VERSION.md"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add latest.json "RELEASE_NOTES_v$VERSION.md"
          if ! git diff --cached --quiet; then
            git commit -m "release: point website to SC220 Live $tag"
          fi

      - name: Publish verified draft and update public site
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if [[ "$RELEASE_IS_DRAFT" == "true" ]]; then
            gh release edit "$tag" --repo "$REPOSITORY" --draft=false --latest
          fi
          git push origin HEAD:main

      - name: Verify published release
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          published="$(gh release view "$tag" --repo "$REPOSITORY" --json isDraft,publishedAt,assets)"
          latest_tag="$(gh api "repos/$REPOSITORY/releases/latest" --jq '.tag_name')"
          [[ "$(jq -r '.isDraft' <<<"$published")" == "false" ]]
          [[ "$(jq -r '.publishedAt' <<<"$published")" != "null" ]]
          [[ "$latest_tag" == "$tag" ]]
          [[ "$(jq -r --arg file "$INSTALLER" '.assets[] | select(.name == $file) | .digest' <<<"$published")" == "sha256:$INSTALLER_SHA256" ]]

          echo "Published $tag with verified binary-only assets."
